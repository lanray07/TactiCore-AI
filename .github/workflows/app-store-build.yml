name: Build and Upload iOS App

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/app-store-build.yml"
      - "TactiCoreAI/**"
      - "TactiCoreAI.xcodeproj/**"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional App Store Connect build number. Defaults to the GitHub run number."
        required: false
        type: string
      upload_to_app_store:
        description: "Upload the exported IPA to App Store Connect."
        required: true
        default: true
        type: boolean

concurrency:
  group: app-store-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archive and Upload
    runs-on: macos-15
    timeout-minutes: 75

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID || vars.APPLE_TEAM_ID || vars.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID || vars.ASC_KEY_ID || vars.APP_STORE_CONNECT_API_KEY_ID || vars.APP_STORE_CONNECT_API_KEY_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || vars.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.ISSUER_ID || secrets.API_KEY_ISSUER_ID || secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORECONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || vars.ASC_ISSUER_ID || vars.ISSUER_ID || vars.API_KEY_ISSUER_ID || vars.APP_STORE_CONNECT_API_KEY_ISSUER_ID || vars.APP_STORE_CONNECT_API_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID || vars.APPSTORECONNECT_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 || secrets.APP_STORE_CONNECT_API_KEY_P8 || secrets.APP_STORE_CONNECT_API_KEY_KEY || secrets.APP_STORE_CONNECT_API_KEY || secrets.APPSTORE_API_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_PRIVATE_KEY || secrets.APPSTORE_PRIVATE_KEY }}
      BUNDLE_ID: com.tacticoreai.app
      PROJECT_PATH: TactiCoreAI.xcodeproj
      SCHEME: TactiCoreAI
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      SHOULD_UPLOAD: ${{ github.event_name == 'push' || inputs.upload_to_app_store }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate App Store Connect secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is required to sign and upload the App Store build."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write App Store Connect API key
        id: api-key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          if [[ "$ASC_API_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            if ! printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null; then
              printf '%s' "$ASC_API_KEY_P8" | base64 -D > "$KEY_PATH"
            fi
          fi

          chmod 600 "$KEY_PATH"
          echo "key-path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          ARCHIVE_PATH="$RUNNER_TEMP/TactiCoreAI.xcarchive"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.key-path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Create export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.key-path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=IPA not found::Xcode export completed without producing an IPA."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA_NAME=$(basename "$IPA_PATH")" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactiCoreAI-iOS-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: env.SHOULD_UPLOAD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "${{ steps.api-key.outputs.key-path }}" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "Uploaded $IPA_NAME build $BUILD_NUMBER to App Store Connect for processing."
